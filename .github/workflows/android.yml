name: Android CI
run-name: AdSkip 1.4.4 · ${{ github.event_name }}

permissions:
  contents: read

concurrency:
  group: adskip-android-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: AdSkip/**/*.gradle*
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Run JVM unit tests
        run: gradle --no-daemon --stacktrace -p AdSkip :app:testDebugUnitTest
      - name: Run Android lint
        run: gradle --no-daemon --stacktrace -p AdSkip :app:lintDebug
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p AdSkip :app:assembleDebug
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AdSkip-1.4.4-debug-apk
          path: AdSkip/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AdSkip-1.4.4-reports
          path: |
            AdSkip/app/build/reports/tests/testDebugUnitTest/**
            AdSkip/app/build/test-results/testDebugUnitTest/**
            AdSkip/app/build/reports/lint-results-debug.html
            AdSkip/app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
          retention-days: 14
