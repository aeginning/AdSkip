name: Android CI
run-name: AdSkip 1.2.0 · ${{ github.event_name }}

permissions:
  contents: write

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source archive when canonical source is absent
        run: |
          if [ ! -d AdSkip ]; then
            unzip -q AdSkip-1.2.0-source.zip -d .
          fi
          test -f AdSkip/app/build.gradle
          echo "Using canonical source tree: AdSkip/"

      - name: Apply permanent source and lint fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("AdSkip/app/src/main")
          def patch(rel, replacements):
              p = root / rel
              s = p.read_text(encoding="utf-8")
              for old, new in replacements:
                  if old in s:
                      s = s.replace(old, new, 1)
                  elif new not in s:
                      raise SystemExit(f"Expected source fragment not found in {p}: {old!r}")
              p.write_text(s, encoding="utf-8")

          # Fix the actual Java generic name collision in the maintained source.
          p = root / "java/com/aeginning/adskip/service/DnsResponseCache.java"
          s = p.read_text(encoding="utf-8")
          for old, new in [
              ("LinkedHashMap<String, Entry>", "LinkedHashMap<String, CacheEntry>"),
              ("new LinkedHashMap<String, Entry>", "new LinkedHashMap<String, CacheEntry>"),
              ("Map.Entry<String, Entry>", "Map.Entry<String, CacheEntry>"),
              ("CacheCacheEntry entry", "CacheEntry entry"),
              ("        Entry entry = entries.get(key)", "        CacheEntry entry = entries.get(key)"),
              ("new Entry(response.clone()", "new CacheEntry(response.clone()"),
              ("private static final class Entry", "private static final class CacheEntry"),
              ("        Entry(byte[] response", "        CacheEntry(byte[] response"),
          ]:
              if old in s:
                  s = s.replace(old, new, 1)
              elif new not in s:
                  raise SystemExit(f"Could not safely rename DNS cache entry: {old}")
          p.write_text(s, encoding="utf-8")

          # Typeface constants must use the documented symbolic values.
          p = root / "java/com/aeginning/adskip/MainActivity.java"
          s = p.read_text(encoding="utf-8")
          s = s.replace("title.setTypeface(null, 1);", "title.setTypeface(null, android.graphics.Typeface.BOLD);")
          s = s.replace("if (bold) view.setTypeface(null, 1);",
                        "if (bold) view.setTypeface(null, android.graphics.Typeface.BOLD);")
          if "setTypeface(null, 1)" in s:
              raise SystemExit("Numeric Typeface constant remains in MainActivity.java")

          # Replace user-visible literals and concatenation with resources.
          replacements = [
              ('title.setText("AdSkip");', 'title.setText(R.string.main_title);'),
              ('ocrSwitch.setText("启用屏幕 OCR 辅助识别");', 'ocrSwitch.setText(R.string.ocr_switch_label);'),
              ('serviceStatus.setText((enabled ? "无障碍服务：已启用" : "无障碍服务：未启用（点击上方按钮开启）")\n                + "\\nDNS 过滤：" + (dns ? "运行中" : "未运行"));',
               'serviceStatus.setText(getString(R.string.service_status,\n                getString(enabled ? R.string.accessibility_enabled : R.string.accessibility_disabled),\n                getString(dns ? R.string.dns_running : R.string.dns_stopped)));'),
              ('check.setText(info.loadLabel(getPackageManager()) + "\\n" + info.activityInfo.packageName);',
               'check.setText(getString(R.string.app_checkbox_label,\n                    info.loadLabel(getPackageManager()), info.activityInfo.packageName));'),
          ]
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new, 1)
              elif new not in s:
                  raise SystemExit(f"Expected MainActivity text fragment not found: {old}")
          p.write_text(s, encoding="utf-8")

          # minSdk is 26: remove dead pre-26 branches without changing API-26+ behavior.
          patch("java/com/aeginning/adskip/service/AdSkipAccessibilityService.java", [
              ("        if (Build.VERSION.SDK_INT < 24) return false;\n", ""),
          ])
          patch("java/com/aeginning/adskip/service/DnsFilterVpnService.java", [
              ("        if (Build.VERSION.SDK_INT >= 26) {\n            NotificationChannel channel = new NotificationChannel(CHANNEL_ID,\n                    \"AdSkip DNS 过滤\", NotificationManager.IMPORTANCE_LOW);\n            channel.setDescription(\"显示 DNS 广告域名过滤运行状态\");\n            getSystemService(NotificationManager.class).createNotificationChannel(channel);\n        }",
               "        NotificationChannel channel = new NotificationChannel(CHANNEL_ID,\n                \"AdSkip DNS 过滤\", NotificationManager.IMPORTANCE_LOW);\n        channel.setDescription(\"显示 DNS 广告域名过滤运行状态\");\n        getSystemService(NotificationManager.class).createNotificationChannel(channel);"),
              ("PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0)",
               "PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE"),
              ("        Notification.Builder builder = Build.VERSION.SDK_INT >= 26\n                ? new Notification.Builder(this, CHANNEL_ID) : new Notification.Builder(this);",
               "        Notification.Builder builder = new Notification.Builder(this, CHANNEL_ID);"),
          ])
          patch("java/com/aeginning/adskip/MainActivity.java", [
              ("        if (Build.VERSION.SDK_INT >= 26) startForegroundService(start);\n        else startService(start);",
               "        startForegroundService(start);"),
          ])

          # Use the app-name resource in the launcher label; supply translated UI strings.
          strings = root / "res/values/strings.xml"
          strings.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">AdSkip 智能跳广告助手</string>
              <string name="main_title">AdSkip</string>
              <string name="accessibility_description">识别用户已启用应用中的明确跳过广告按钮；点击前执行安全检查。</string>
              <string name="ocr_switch_label">启用屏幕 OCR 辅助识别</string>
              <string name="accessibility_enabled">已启用</string>
              <string name="accessibility_disabled">未启用（点击上方按钮开启）</string>
              <string name="dns_running">运行中</string>
              <string name="dns_stopped">未运行</string>
              <string name="service_status">无障碍服务：%1$s\nDNS 过滤：%2$s</string>
              <string name="app_checkbox_label">%1$s\n%2$s</string>
          </resources>
          """, encoding="utf-8")

          # Explicit backup exclusion rules keep the app's private rules/data out of backups.
          (root / "res/xml/data_extraction_rules.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules>
              <cloud-backup>
                  <exclude domain="root" path="." />
              </cloud-backup>
              <device-transfer>
                  <exclude domain="root" path="." />
              </device-transfer>
          </data-extraction-rules>
          """, encoding="utf-8")
          (root / "res/xml/backup_rules.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <full-backup-content>
              <exclude domain="root" path="." />
          </full-backup-content>
          """, encoding="utf-8")

          # Give the launcher a small, self-contained vector icon.
          (root / "res/drawable").mkdir(parents=True, exist_ok=True)
          (root / "res/drawable/ic_adskip.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp" android:height="48dp"
              android:viewportWidth="48" android:viewportHeight="48">
              <path android:fillColor="#2563EB"
                  android:pathData="M24,2 L43,9 L41,27 C39,36 32,42 24,46 C16,42 9,36 7,27 L5,9 Z" />
              <path android:fillColor="#FFFFFF"
                  android:pathData="M19.5,31.5 L11.5,23.5 L15,20 L19.5,24.5 L32.5,11.5 L36,15 Z" />
          </vector>
          """, encoding="utf-8")

          # Correctly mark the screenshot capability as API 30+, while retaining API 26+ support.
          xml = root / "res/xml/ad_accessibility_service.xml"
          x = xml.read_text(encoding="utf-8")
          x = re.sub(r'(?m)^\s*xmlns:tools="http://schemas.android.com/tools" tools:targetApi="r"\s*\n', "", x)
          if 'xmlns:tools=' not in x:
              x = x.replace('xmlns:android="http://schemas.android.com/apk/res/android"\n',
                            'xmlns:android="http://schemas.android.com/apk/res/android"\n    xmlns:tools="http://schemas.android.com/tools" tools:targetApi="r"\n', 1)
          if x.count('xmlns:tools=') != 1:
              raise SystemExit("Accessibility XML tools namespace is not normalized")
          xml.write_text(x, encoding="utf-8")

          # The active VPN role is the documented systemExempted eligibility path.
          manifest = root / "AndroidManifest.xml"
          m = manifest.read_text(encoding="utf-8")
          m = m.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                        '<manifest xmlns:android="http://schemas.android.com/apk/res/android"\n    xmlns:tools="http://schemas.android.com/tools">')
          m = m.replace('        android:allowBackup="false"\n        android:label="AdSkip 智能跳广告助手"',
                        '        android:allowBackup="false"\n        android:dataExtractionRules="@xml/data_extraction_rules"\n        android:fullBackupContent="@xml/backup_rules"\n        android:icon="@drawable/ic_adskip"\n        android:label="@string/app_name"')
          m = m.replace('            android:foregroundServiceType="systemExempted">',
                        '            android:foregroundServiceType="systemExempted"\n            tools:ignore="ForegroundServicePermission">')
          if 'android:dataExtractionRules="@xml/data_extraction_rules"' not in m:
              raise SystemExit("Manifest backup/icon patch failed")
          manifest.write_text(m, encoding="utf-8")

          # Raise targetSdk to the already-installed API 35 platform when the source is older.
          gradle = Path("AdSkip/app/build.gradle")
          g = gradle.read_text(encoding="utf-8")
          g2 = re.sub(r'(?m)^(\s*targetSdk(?:Version)?\s+)(\d+)', lambda x: x.group(1) + str(max(35, int(x.group(2)))), g)
          if g2 != g:
              gradle.write_text(g2, encoding="utf-8")

          print("Permanent AdSkip source fixes applied.")
          PY

      - name: Commit canonical source tree
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AdSkip
          if ! git diff --cached --quiet; then
            git commit -m "fix: resolve AdSkip lint issues and publish source tree"
            git push origin HEAD:main
          else
            echo "Canonical source tree already up to date."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: AdSkip/**/*.gradle*

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Run JVM unit tests
        run: gradle --no-daemon -p AdSkip :app:testDebugUnitTest

      - name: Run Android lint
        run: gradle --no-daemon -p AdSkip :app:lintDebug

      - name: Build debug APK
        run: gradle --no-daemon -p AdSkip :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AdSkip-1.2.0-debug-apk
          path: AdSkip/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AdSkip-1.2.0-reports
          path: |
            AdSkip/app/build/reports/tests/testDebugUnitTest/**
            AdSkip/app/build/test-results/testDebugUnitTest/**
            AdSkip/app/build/reports/lint-results-debug.html
            AdSkip/app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
          retention-days: 14
