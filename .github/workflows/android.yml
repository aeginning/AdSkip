name: Android CI
run-name: AdSkip 1.2.0 · ${{ github.event_name }}

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract complete source archive
        run: unzip -q AdSkip-1.2.0-source.zip -d .

      - name: Apply DNS cache Java compile fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("AdSkip/app/src/main/java/com/aeginning/adskip/service/DnsResponseCache.java")
          s = p.read_text(encoding="utf-8")
          old = "removeEldestEntry(Map.Entry<String, Entry> eldest)"
          new = "removeEldestEntry(java.util.Map.Entry<String, DnsResponseCache.Entry> eldest)"
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding="utf-8")
          elif new not in s:
              raise SystemExit("Expected DnsResponseCache method signature was not found; refusing an unsafe patch.")
          print("DnsResponseCache generic signature verified.")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: AdSkip/**/*.gradle*

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Run JVM unit tests
        run: gradle --no-daemon -p AdSkip :app:testDebugUnitTest

      - name: Run Android lint
        run: gradle --no-daemon -p AdSkip :app:lintDebug

      - name: Build debug APK
        run: gradle --no-daemon -p AdSkip :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AdSkip-1.2.0-debug-apk
          path: AdSkip/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AdSkip-1.2.0-reports
          path: |
            AdSkip/app/build/reports/tests/testDebugUnitTest/**
            AdSkip/app/build/test-results/testDebugUnitTest/**
            AdSkip/app/build/reports/lint-results-debug.html
            AdSkip/app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
          retention-days: 14
